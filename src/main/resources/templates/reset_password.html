<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Reset password')}">
    <title>Reset password</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container app-main">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h1 class="page-heading h4 mb-3">Reset your password</h1>

            <form th:object="${resetform}" th:action="@{/reset_password}" method="post" class="d-grid gap-3">
                <input type="hidden" name="token" th:value="${token}"/>
                <div>
                    <label class="form-label small fw-semibold" for="password">Password</label>
                    <input type="password" th:field="*{password}" id="password" class="form-control" autocomplete="new-password"/>
                    <p class="text-danger small mb-0 mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password Error</p>
                </div>
                <div>
                    <label class="form-label small fw-semibold" for="passwordCheck">Re-type password</label>
                    <input type="password" th:field="*{passwordCheck}" id="passwordCheck" class="form-control" autocomplete="new-password"/>
                    <p class="text-danger small mb-0 mt-1" th:if="${#fields.hasErrors('passwordCheck')}" th:errors="*{passwordCheck}">Password Match Error</p>
                </div>
                <button type="submit" class="btn btn-primary">Reset password</button>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
