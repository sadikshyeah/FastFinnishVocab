<!-- AI-assisted frontend styling -->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Learn')}">
    <title>Learn</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<style>
    .reveal-toggle {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }

    .reveal-value {
        display: none;
    }

    .reveal-toggle:checked ~ .reveal-value {
        display: block;
    }

    .reveal-placeholder {
        border: 1px dashed #cbd5e1;
        border-radius: 0.5rem;
        background: #f8fafc;
        color: #64748b;
        padding: 0.75rem 1rem;
        margin-bottom: 1.5rem;
        font-size: 0.95rem;
        cursor: pointer;
    }

    .reveal-toggle:checked ~ .reveal-placeholder {
        display: none;
    }
</style>

<main class="container app-main">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h1 class="page-heading h2 mb-1">Learn</h1>
            <p class="text-secondary mb-0">
                Level <span class="badge text-bg-primary rounded-pill" th:text="${user.level.name}">A1</span>
                <a th:href="@{/setLevel}" class="ms-2 small link-secondary text-decoration-none">Change</a>
            </p>
        </div>
    </div>

    <div class="row justify-content-center" th:if="${word != null}">
        <div class="col-lg-8">
            <div class="card card-learn">
                <div class="card-body p-4 p-md-5">
                    <p class="label-muted mb-1">Finnish</p>
                    <p class="display-word mb-4" th:text="${word.wordFi}">sana</p>
                    <input class="reveal-toggle" type="checkbox" id="revealWordDetails">
                    <p class="label-muted mb-1">English</p>
                    <label for="revealWordDetails" class="reveal-placeholder">Reveal meaning</label>
                    <p class="fs-5 mb-4 reveal-value" th:text="${word.definitionEn}">meaning</p>
                    <p class="label-muted mb-1">Example</p>
                    <label for="revealWordDetails" class="reveal-placeholder">Reveal meaning</label>
                    <p class="lead text-secondary mb-4 reveal-value" th:text="${word.example}">example sentence</p>
                    <br>
                    <a th:href="@{/learn}" class="btn btn-primary btn-lg">Next word</a>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-info border-0 shadow-sm rounded-3" th:if="${word == null}" role="alert">
        No words are available for your level yet. Ask an admin to add vocabulary.
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
