<!-- AI-assisted frontend styling -->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Learn')}">
    <title>Learn</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container app-main">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h1 class="page-heading h2 mb-1">Learn</h1>
            <p class="text-secondary mb-0">
                Level <span class="badge text-bg-primary rounded-pill" th:text="${user.level.name}">A1</span>
            </p>
        </div>
    </div>

    <div class="row justify-content-center" th:if="${word != null}">
        <div class="col-lg-8">
            <div class="card card-learn">
                <div class="card-body p-4 p-md-5">
                    <p class="label-muted mb-1">Finnish</p>
                    <p class="display-word mb-4" th:text="${word.wordFi}">sana</p>
                    <p class="label-muted mb-1">English</p>
                    <p class="fs-5 mb-4" th:text="${word.definitionEn}">meaning</p>
                    <p class="label-muted mb-1">Example</p>
                    <p class="lead text-secondary mb-4" th:text="${word.example}">example sentence</p>
                    <a th:href="@{/learn}" class="btn btn-primary btn-lg">Next word</a>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-info border-0 shadow-sm rounded-3" th:if="${word == null}" role="alert">
        No words are available for your level yet. Ask an admin to add vocabulary.
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
