<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Forgot password')}">
    <title>Forgot password</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container app-main">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h1 class="page-heading h4 mb-3">Forgot password</h1>

            <div class="alert alert-danger" th:if="${error != null}">
                <p class="mb-0" th:text="${error}">Error</p>
            </div>
            <div class="alert alert-warning" th:if="${message != null}">
                <p class="mb-0" th:text="${message}">Message</p>
            </div>

            <form th:action="@{/forgot_password}" method="post" class="d-grid gap-3">
                <div>
                    <label class="form-label small fw-semibold" for="email">Email</label>
                    <input type="email" name="email" id="email" class="form-control" required autofocus/>
                </div>
                <button type="submit" class="btn btn-primary">Send link</button>
            </form>

            <p class="small text-secondary mt-4 mb-0">
                <a th:href="@{/login}">Sign in</a>
                ·
                <a th:href="@{/signup}">Sign up</a>
            </p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
