<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Invalid link')}">
    <title>Invalid link</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container app-main">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="page-heading h4 mb-3">That link is invalid or has expired</h1>
            <p class="text-secondary mb-0">Try signing up again or request a new password reset.</p>
            <p class="mt-3 mb-0">
                <a th:href="@{/login}">Sign in</a>
                ·
                <a th:href="@{/signup}">Sign up</a>
            </p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
