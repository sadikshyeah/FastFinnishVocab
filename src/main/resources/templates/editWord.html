<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Word</title>
</head>
<body>

<h2>Edit Word</h2>

<form th:action="@{/save}" th:object="${word}" method="post">

    <input type="hidden" th:field="*{id}" />

    Finnish: <input type="text" th:field="*{wordFi}" /><br>
    English: <input type="text" th:field="*{definitionEn}" /><br>
    Example: <input type="text" th:field="*{example}" /><br>

    <button type="submit">Update</button>

</form>

</body>
</html>
