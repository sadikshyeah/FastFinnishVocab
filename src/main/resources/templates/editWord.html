<!-- AI-assisted frontend styling -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Edit word')}">
    <title>Edit word</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container app-main">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <h1 class="page-heading h2 mb-4">Edit word</h1>
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-body p-4">
                    <form th:action="@{/save}" th:object="${word}" method="post" class="vstack gap-3">
                        <input type="hidden" th:field="*{id}">
                        <div>
                            <label for="wordFi" class="form-label">Finnish</label>
                            <input id="wordFi" type="text" class="form-control" th:field="*{wordFi}" required
                                   autocomplete="off">
                        </div>
                        <div>
                            <label for="definitionEn" class="form-label">English</label>
                            <input id="definitionEn" type="text" class="form-control" th:field="*{definitionEn}"
                                   required autocomplete="off">
                        </div>
                        <div>
                            <label for="example" class="form-label">Example sentence</label>
                            <input id="example" type="text" class="form-control" th:field="*{example}" required
                                   autocomplete="off">
                        </div>
                        <div class="d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-primary">Update</button>
                            <a th:href="@{/wordlist}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
