<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <title>Word List</title>
    <meta charset="UTF-8">
</head>

<body>

    <h1>Word List</h1>
    <div class="col-md-4">
        Welcome
        <span sec:authentication="name">Username</span>
    </div>
	<div class="col-md-4" style="padding:20px 0">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Sign Out"
                   class="btn btn-sm btn-danger"/>
        </form>
    </div>

    <table border="1">
        <tr>
            <th>Finnish Word</th>
            <th>English Meaning</th>
            <th>Example</th>
            <th>Actions</th>
    
        </tr>

        <tr th:each="word : ${words}">
            <td th:text="${word.wordFi}"></td>
            <td th:text="${word.definitionEn}"></td>
            <td th:text="${word.example}"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${word.id})}">Edit</a>
                <a th:href="@{/delete/{id}(id=${word.id})}">Delete</a>
            </td>
        </tr>
    </table>
     <a href="/add" class="btn btn-primary">Add Word</a>
</body>

</html>
