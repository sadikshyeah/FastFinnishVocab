<!-- AI-assisted frontend styling -->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Word list')}">
    <title>Word list</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container app-main">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="page-heading h2 mb-1">Word list</h1>
            <p class="text-secondary mb-0">
                Signed in as <strong sec:authentication="name">user</strong>
            </p>
        </div>
        <a th:href="@{/add}" class="btn btn-primary">Add word</a>
    </div>

    <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover table-words mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Finnish</th>
                    <th>English</th>
                    <th>Example</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="word : ${words}">
                    <td class="fw-medium" th:text="${word.wordFi}">sana</td>
                    <td th:text="${word.definitionEn}">meaning</td>
                    <td class="text-secondary small" th:text="${word.example}">example</td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/edit/{id}(id=${word.id})}" class="btn btn-sm btn-outline-secondary btn-action">Edit</a>
                        <a th:href="@{/delete/{id}(id=${word.id})}" class="btn btn-sm btn-outline-danger btn-action"
                           onclick="return confirm('Delete this word?');">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
