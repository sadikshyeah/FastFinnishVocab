<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head (pageTitle='Sign in')}">
    <title>Sign in</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container app-main">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h1 class="page-heading h4 mb-3">Sign in</h1>

            <div class="alert alert-danger" th:if="${param.error != null and param.error[0] == 'unverified'}">
                Your account is not yet verified. Please check your email for the verification link.
            </div>
            <div class="alert alert-danger" th:if="${param.error != null and param.error[0] != 'unverified'}">
                Invalid username and password.
            </div>
            <div class="alert alert-warning" th:if="${param.logout}">
                You have been logged out.
            </div>

            <form th:action="@{/login}" method="post" class="d-grid gap-3">
                <div>
                    <label class="form-label small fw-semibold" for="username">Username</label>
                    <input type="text" name="username" id="username" class="form-control" autocomplete="username" required autofocus/>
                </div>
                <div>
                    <label class="form-label small fw-semibold" for="password">Password</label>
                    <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required/>
                </div>
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>

            <p class="small text-secondary mt-4 mb-0">
                <a th:href="@{/signup}">Sign up</a>
                ·
                <a th:href="@{/forgot_password}">Forgot your password?</a>
            </p>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
